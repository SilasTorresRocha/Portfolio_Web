services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTFOLIO_PASTA_DADOS: /app/dados
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${PORTFOLIO_PORTA:-8000}:8000"
    volumes:
      - ./dados:/app/dados
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
