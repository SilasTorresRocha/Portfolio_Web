{% extends "base.html" %}

{% block meta_robots %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block conteudo %}
<section class="bloco caixa-login">
  <h1 class="titulo-pagina" style="font-size: 21px; margin-bottom: 18px;">Acesso restrito</h1>

  {% if erro %}
  <div class="alerta alerta-erro" role="alert">{{ erro }}</div>
  {% endif %}

  <form method="post" action="/config/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        class="entrada"
        autocomplete="current-password"
        required
        autofocus
      >
    </div>

    <div class="acoes-linha" style="margin-top: 16px;">
      <button type="submit" class="botao botao-primario" style="width: 100%;">
        Entrar
      </button>
    </div>
  </form>
</section>
{% endblock %}
