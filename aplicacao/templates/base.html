<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo_pagina or "Portfólio Técnico" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estaticos/estilo.css">
  {% if perfil and perfil.cor_destaque %}
  <style>:root { --cor-destaque: {{ perfil.cor_destaque }}; }</style>
  {% endif %}
</head>
<body>
  <header class="barra-topo">
    <div class="container barra-topo-interna">
      <a class="marca" href="/">
        <span class="marca-ponto" aria-hidden="true"></span>
        <span>{{ perfil.titulo_site if perfil and perfil.titulo_site else "Portfólio Técnico" }}</span>
      </a>
      <nav class="navegacao" aria-label="Navegação principal">
        <a class="link-nav" href="/">vitrine</a>
        <a class="link-nav" href="/saude">/saude</a>
        <a class="link-nav" href="/config">/config</a>
      </nav>
    </div>
  </header>

  <main class="principal">
    <div class="container">
      {% block conteudo %}{% endblock %}
    </div>
  </main>
</body>
</html>
